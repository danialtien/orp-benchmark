# D+A (seed 1)
# Generated from the original run records. Every training-relevant flag is listed explicitly,
# including those equal to the trainer default, so no default has to be looked up.
# Run:  python tools/run_config.py train configs/train/DA_s1.yaml --data-root ../Dataset --out-root runs

name: DA_s1
paper_label: "D+A (seed 1)"
entry: sar_person.train_dataset
init_from: D   # config name; resolved to that run's released checkpoint
seed: 1
args:
  datasets: [cuhk_author]
  limit: 0
  encoder: clip
  pretrain: ViT-B/16
  img-size: [384, 128]
  full-finetune: true
  loss: sdm
  sdm-temp: 0.02
  hard-neg-weight: 0
  id-loss-weight: 1.0
  mlm-loss-weight: 1.0
  cmt-depth: 4
  aug: true
  sampler: random
  optimizer: adam
  lr: 1e-5
  lr-factor: 5.0
  bias-lr-factor: 2.0
  weight-decay: 4e-5
  weight-decay-bias: 0
  batch: 64
  eval-every: 5
  select-metric: "t2i_R@1"
  eval-ids: 300
  lr-schedule: constant
  warmup-epochs: 5
  epochs: 10
  eval-size: 1000
  occ-prob: 0.5
  occ-variants: [torso, cutout, foliage]
  occ-levels: [0.25, 0.5, 0.7]
checkpoint:
  selection: best   # best = highest validation t2i_R@1 (lora_ckpt.pt); last = final epoch (lora_ckpt_last.pt)
  selected_epoch: "4 (of 0-9)"
  validation: "300 held-out training identities drawn with seed 1, capped at 1,000 images"
  release_file: checkpoints/DA_s1.pt
  sha256: b9fafbb5ec6042c851ef1493d46a122ce527b76134584a4f16d0f53c06c9f745
  size_bytes: 598567674
provenance:
  original_run: "Result/261017/Docc_seed1"
  original_file: "lora_ckpt.pt"
  launcher: "scripts/original_launchers/run_revision.sh seed 1"
  wall_clock_hours: 1.63   # one RTX 3090, AMP fp16, ~13 GB
notes: "The seed changes occlusion draws, data order, dropout and the held-out identities."
